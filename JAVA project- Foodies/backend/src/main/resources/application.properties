# ============================================================================
# Foodies Backend Configuration (Spring Boot + PostgreSQL JDBC)
# ============================================================================
spring.application.name=foodies-backend
server.port=8080

# PostgreSQL JDBC Connection
# Configure DB_PASSWORD in your environment (or IntelliJ Run Configuration)
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:foodies_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:shibu123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Session Cookie Configuration (Beginner-friendly secure session auth)
server.servlet.session.timeout=60m
server.servlet.session.cookie.name=FOODIES_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/

# Friendly JSON error settings
server.error.include-message=always
spring.jackson.serialization.write-dates-as-timestamps=false

